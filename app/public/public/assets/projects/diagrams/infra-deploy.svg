<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="system-ui,Segoe UI,sans-serif">
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="dr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#0f172a"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Ciclo de despliegue</text>
  <text x="40" y="74" fill="#94a3b8" font-size="13">De un push en el repositorio a la versión nueva sirviendo, sin entrar por consola</text>

  <rect x="40" y="110" width="190" height="92" rx="12" fill="#111827" stroke="#334155"/>
  <text x="135" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">1 · Push</text>
  <text x="135" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">rama principal</text>
  <text x="135" y="182" fill="#64748b" font-size="10" text-anchor="middle">del repositorio del proyecto</text>

  <rect x="270" y="110" width="200" height="92" rx="12" fill="#111827" stroke="#334155"/>
  <text x="370" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">2 · Aviso firmado</text>
  <text x="370" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">webhook con firma HMAC</text>
  <text x="370" y="182" fill="#64748b" font-size="10" text-anchor="middle">sin firma válida, se descarta</text>

  <rect x="510" y="102" width="220" height="108" rx="12" fill="#2a1a06" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="132" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="700">3 · Panel de control</text>
  <text x="620" y="155" fill="#fcd34d" font-size="11" text-anchor="middle">descarga · construye imagen</text>
  <text x="620" y="175" fill="#fcd34d" font-size="11" text-anchor="middle">migra base de datos</text>
  <text x="620" y="195" fill="#a16207" font-size="10" text-anchor="middle">registra log de cada paso</text>

  <rect x="770" y="110" width="190" height="92" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="865" y="140" fill="#58c896" font-size="13" text-anchor="middle" font-weight="700">4 · Comprobación</text>
  <text x="865" y="162" fill="#cbd5e1" font-size="11" text-anchor="middle">healthcheck del contenedor</text>
  <text x="865" y="182" fill="#64748b" font-size="10" text-anchor="middle">y respuesta real del dominio</text>

  <rect x="1000" y="110" width="160" height="92" rx="12" fill="#0b2c3d" stroke="#38bdf8"/>
  <text x="1080" y="146" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">5 · En vivo</text>
  <text x="1080" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle">el proxy apunta</text>
  <text x="1080" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">a la versión nueva</text>

  <path d="M232 156 H268" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#d)"/>
  <path d="M472 156 H508" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#d)"/>
  <path d="M732 156 H768" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#d)"/>
  <path d="M962 156 H998" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#d)"/>

  <path d="M865 204 V250 H620 V212" stroke="#ef4444" stroke-width="2.2" fill="none" marker-end="url(#dr)"/>
  <text x="742" y="270" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="700">si no responde: no se publica</text>
  <text x="742" y="290" fill="#94a3b8" font-size="11" text-anchor="middle">la versión anterior sigue sirviendo y el fallo se avisa por correo</text>

  <rect x="40" y="330" width="1120" height="86" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="358" fill="#e2e8f0" font-size="12" font-weight="700">Por qué el aviso va firmado</text>
  <text x="60" y="382" fill="#94a3b8" font-size="11">Un endpoint que despliega es un endpoint que ejecuta código en el servidor. Si aceptara cualquier petición, bastaría con conocer la dirección para</text>
  <text x="60" y="402" fill="#94a3b8" font-size="11">forzar despliegues. Cada proyecto tiene su propio secreto compartido y la firma se compara en tiempo constante; sin firma válida ni se lee el cuerpo.</text>

  <rect x="40" y="440" width="1120" height="86" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="468" fill="#e2e8f0" font-size="12" font-weight="700">Antes de tocar nada: copia verificada</text>
  <text x="60" y="492" fill="#94a3b8" font-size="11">Las migraciones se aplican después de una copia de la base de datos, y la copia se comprueba abriéndola, no solo mirando que el fichero exista.</text>
  <text x="60" y="512" fill="#94a3b8" font-size="11">Una copia que no se ha abierto nunca no es una copia: es un fichero del que nadie sabe nada.</text>
</svg>
