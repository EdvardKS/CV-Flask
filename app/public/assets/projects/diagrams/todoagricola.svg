<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="system-ui,Segoe UI,sans-serif">
  <defs><marker id="t1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
  <rect width="1000" height="430" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">Todo Agrícola · solo la fachada existe desde fuera</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: canal de venta propio para una tienda local, sin comisiones de plataforma</text>
  <rect x="40" y="112" width="170" height="80" rx="12" fill="#111827" stroke="#334155"/>
  <text x="125" y="146" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Cliente</text>
  <text x="125" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">navegador</text>
  <rect x="255" y="112" width="180" height="80" rx="12" fill="#0b2c3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="345" y="140" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">Proxy</text>
  <text x="345" y="164" fill="#cbd5e1" font-size="11" text-anchor="middle">único con puertos</text>
  <text x="345" y="182" fill="#cbd5e1" font-size="11" text-anchor="middle">abiertos</text>
  <path d="M212 152 H253" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#t1)"/>
  <rect x="480" y="88" width="480" height="180" rx="14" fill="#0b1220" stroke="#1e293b" stroke-dasharray="6 4"/>
  <text x="500" y="114" fill="#94a3b8" font-size="11" font-weight="700">red privada del proyecto</text>
  <rect x="500" y="128" width="140" height="76" rx="10" fill="#132132" stroke="#38bdf8"/>
  <text x="570" y="158" fill="#7dd3fc" font-size="12" text-anchor="middle" font-weight="700">Tienda</text>
  <text x="570" y="180" fill="#64748b" font-size="10" text-anchor="middle">fachada</text>
  <rect x="660" y="128" width="140" height="76" rx="10" fill="#132132" stroke="#334155"/>
  <text x="730" y="164" fill="#cbd5e1" font-size="12" text-anchor="middle">API</text>
  <rect x="820" y="128" width="120" height="76" rx="10" fill="#132132" stroke="#334155"/>
  <text x="880" y="164" fill="#cbd5e1" font-size="12" text-anchor="middle">MySQL</text>
  <text x="720" y="238" fill="#475569" font-size="11" text-anchor="middle">ni la API ni la base de datos publican puerto alguno</text>
  <path d="M437 152 H498" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#t1)"/>
  <path d="M642 166 H658" stroke="#64748b" stroke-width="2" marker-end="url(#t1)"/>
  <path d="M802 166 H818" stroke="#64748b" stroke-width="2" marker-end="url(#t1)"/>
  <rect x="40" y="300" width="450" height="102" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="265" y="328" fill="#58c896" font-size="13" text-anchor="middle" font-weight="700">Pedido y suscripción</text>
  <text x="265" y="352" fill="#cbd5e1" font-size="11" text-anchor="middle">compra puntual o cesta recurrente</text>
  <text x="265" y="374" fill="#94a3b8" font-size="10" text-anchor="middle">quien la quiere cada semana no vuelve a pedirla</text>
  <rect x="510" y="300" width="450" height="102" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="530" y="328" fill="#e2e8f0" font-size="12" font-weight="700">Por qué importa el aislamiento aquí</text>
  <text x="530" y="350" fill="#94a3b8" font-size="11">Una tienda guarda direcciones, teléfonos e historial de compra.</text>
  <text x="530" y="370" fill="#94a3b8" font-size="11">Que la base no sea alcanzable desde Internet no es una capa más:</text>
  <text x="530" y="388" fill="#94a3b8" font-size="11">es lo que hace que una contraseña filtrada no sirva de nada.</text>
</svg>
