<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="system-ui,Segoe UI,sans-serif">
  <defs>
    <marker id="v" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="vg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58c896"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#0f172a"/>
  <text x="40" y="48" fill="#e2e8f0" font-size="24" font-weight="700">Vigilancia y recuperación</text>
  <text x="40" y="74" fill="#94a3b8" font-size="13">Qué se mira, cada cuánto, y qué se arregla solo sin que nadie intervenga</text>

  <rect x="440" y="106" width="320" height="86" rx="12" fill="#2a1a06" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="140" fill="#fbbf24" font-size="15" text-anchor="middle" font-weight="700">🛠️ Panel de control</text>
  <text x="600" y="164" fill="#fcd34d" font-size="11" text-anchor="middle">recoge señales, decide y avisa</text>
  <text x="600" y="182" fill="#a16207" font-size="10" text-anchor="middle">privado · doble factor</text>

  <g>
    <rect x="40" y="240" width="250" height="120" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="165" y="268" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Contenedores</text>
    <text x="165" y="292" fill="#94a3b8" font-size="11" text-anchor="middle">vivos, sanos y con la</text>
    <text x="165" y="310" fill="#94a3b8" font-size="11" text-anchor="middle">imagen que les toca</text>
    <text x="165" y="338" fill="#58c896" font-size="11" text-anchor="middle" font-weight="700">cada minuto</text>
  </g>
  <g>
    <rect x="310" y="240" width="250" height="120" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="435" y="268" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Dominios</text>
    <text x="435" y="292" fill="#94a3b8" font-size="11" text-anchor="middle">responden de verdad,</text>
    <text x="435" y="310" fill="#94a3b8" font-size="11" text-anchor="middle">no solo "el proceso vive"</text>
    <text x="435" y="338" fill="#58c896" font-size="11" text-anchor="middle" font-weight="700">cada 5 minutos</text>
  </g>
  <g>
    <rect x="580" y="240" width="250" height="120" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="705" y="268" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Certificados</text>
    <text x="705" y="292" fill="#94a3b8" font-size="11" text-anchor="middle">caducidad y renovación</text>
    <text x="705" y="310" fill="#94a3b8" font-size="11" text-anchor="middle">antes de que expiren</text>
    <text x="705" y="338" fill="#58c896" font-size="11" text-anchor="middle" font-weight="700">a diario</text>
  </g>
  <g>
    <rect x="850" y="240" width="310" height="120" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="1005" y="268" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Recursos y correo</text>
    <text x="1005" y="292" fill="#94a3b8" font-size="11" text-anchor="middle">disco, memoria, carga,</text>
    <text x="1005" y="310" fill="#94a3b8" font-size="11" text-anchor="middle">cola de envíos y rebotes</text>
    <text x="1005" y="338" fill="#58c896" font-size="11" text-anchor="middle" font-weight="700">continuo</text>
  </g>

  <path d="M165 238 C 165 210, 460 210, 500 194" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#v)"/>
  <path d="M435 238 C 435 215, 540 210, 560 194" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#v)"/>
  <path d="M705 238 C 705 215, 650 210, 640 194" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#v)"/>
  <path d="M1005 238 C 1005 210, 740 210, 700 194" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#v)"/>

  <rect x="40" y="410" width="360" height="118" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="220" y="440" fill="#58c896" font-size="13" text-anchor="middle" font-weight="700">Se arregla solo</text>
  <text x="220" y="464" fill="#cbd5e1" font-size="11" text-anchor="middle">un contenedor caído se levanta</text>
  <text x="220" y="484" fill="#cbd5e1" font-size="11" text-anchor="middle">un certificado a punto se renueva</text>
  <text x="220" y="506" fill="#64748b" font-size="10" text-anchor="middle">sin despertar a nadie</text>

  <rect x="420" y="410" width="360" height="118" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="600" y="440" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="700">Se avisa</text>
  <text x="600" y="464" fill="#fcd34d" font-size="11" text-anchor="middle">no vuelve tras el reintento</text>
  <text x="600" y="484" fill="#fcd34d" font-size="11" text-anchor="middle">disco lleno · cola de correo atascada</text>
  <text x="600" y="506" fill="#a16207" font-size="10" text-anchor="middle">correo con el detalle, no solo "algo falla"</text>

  <rect x="800" y="410" width="360" height="118" rx="12" fill="#2a0b0b" stroke="#ef4444"/>
  <text x="980" y="440" fill="#fca5a5" font-size="13" text-anchor="middle" font-weight="700">Se guarda como incidente</text>
  <text x="980" y="464" fill="#fecaca" font-size="11" text-anchor="middle">queda histórico de qué pasó</text>
  <text x="980" y="484" fill="#fecaca" font-size="11" text-anchor="middle">y de cuánto tardó en volver</text>
  <text x="980" y="506" fill="#7f1d1d" font-size="10" text-anchor="middle">para poder mirarlo con calma después</text>

  <path d="M540 194 C 400 300, 300 350, 220 408" stroke="#58c896" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#vg)"/>
  <path d="M600 194 V408" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#v)"/>
  <path d="M660 194 C 800 300, 900 350, 975 408" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>

  <rect x="40" y="556" width="1120" height="60" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="582" fill="#e2e8f0" font-size="12" font-weight="700">La diferencia entre "el proceso vive" y "la web funciona"</text>
  <text x="60" y="604" fill="#94a3b8" font-size="11">Un contenedor puede estar en marcha y devolver error en todas las páginas. Por eso la comprobación entra por el dominio, como un visitante, en vez de preguntarle al proceso si se encuentra bien.</text>
</svg>
