  <path d="M522 146 H578" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a1)"/>
  <path d="M782 146 H838" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a1)"/>

  <text x="40" y="256" fill="#f59e0b" font-size="13" font-weight="700">LO QUE ALIMENTA LA PREDICCIÓN</text>

  <rect x="40" y="274" width="230" height="92" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="155" y="302" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">Clima de Villena</text>
  <text x="155" y="324" fill="#fcd34d" font-size="11" text-anchor="middle">histórico y previsión 7 días</text>
  <text x="155" y="344" fill="#a16207" font-size="10" text-anchor="middle">se sincroniza cada 2 días</text>

  <rect x="300" y="274" width="230" height="92" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
