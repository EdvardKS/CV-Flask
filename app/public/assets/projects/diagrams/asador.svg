  <text x="680" y="150" fill="#94a3b8" font-size="11" text-anchor="middle">avisos WhatsApp</text>
  <text x="680" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">correos y tareas lentas</text>
  <text x="680" y="188" fill="#64748b" font-size="10" text-anchor="middle">no bloquean el pedido</text>

  <rect x="840" y="98" width="220" height="96" rx="12" fill="#111827" stroke="#334155"/>
  <text x="950" y="128" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Base de datos</text>
  <text x="950" y="150" fill="#94a3b8" font-size="11" text-anchor="middle">pedidos · stock · histórico</text>
  <text x="950" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">de venta por día</text>
  <text x="950" y="188" fill="#64748b" font-size="10" text-anchor="middle">copia nocturna verificada</text>

