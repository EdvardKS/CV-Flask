  <rect width="1100" height="600" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">Asador La Morenica · del encargo al horno</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: saber cuánto montar antes de encenderlo, y no perder ningún encargo</text>

