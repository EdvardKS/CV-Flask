<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="system-ui,Segoe UI,sans-serif">
  <defs><marker id="e1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
  <marker id="e2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58c896"/></marker></defs>
  <rect width="1000" height="450" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">AILEDU · el ticket se fotografía y el gasto se rellena solo</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: que llevar las cuentas en común no dependa de la disciplina de nadie</text>
  <rect x="40" y="112" width="200" height="94" rx="12" fill="#0b2c3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="142" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">📸 Foto del ticket</text>
  <text x="140" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">desde el móvil,</text>
  <text x="140" y="186" fill="#cbd5e1" font-size="11" text-anchor="middle">en el mismo momento</text>
  <rect x="300" y="112" width="200" height="94" rx="12" fill="#111827" stroke="#334155"/>
  <text x="400" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Servicio OCR</text>
  <text x="400" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">contenedor aparte</text>
  <text x="400" y="186" fill="#94a3b8" font-size="11" text-anchor="middle">en Python</text>
  <rect x="560" y="112" width="200" height="94" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="660" y="142" fill="#58c896" font-size="13" text-anchor="middle" font-weight="700">Gasto prerrellenado</text>
  <text x="660" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">importe y comercio</text>
  <text x="660" y="186" fill="#94a3b8" font-size="10" text-anchor="middle">solo hay que confirmar</text>
  <rect x="820" y="112" width="140" height="94" rx="12" fill="#111827" stroke="#334155"/>
  <text x="890" y="146" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Panel</text>
  <text x="890" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">compartido</text>
  <text x="890" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">entre los dos</text>
  <path d="M242 159 H298" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#e1)"/>
  <path d="M502 159 H558" stroke="#58c896" stroke-width="2.5" marker-end="url(#e2)"/>
  <path d="M762 159 H818" stroke="#58c896" stroke-width="2.5" marker-end="url(#e2)"/>
  <rect x="40" y="250" width="290" height="90" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="185" y="278" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Almacén de objetos propio</text>
  <text x="185" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">las fotos no se guardan</text>
  <text x="185" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">junto a la base de datos</text>
  <rect x="355" y="250" width="290" height="90" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="500" y="278" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Avisos al móvil</text>
  <text x="500" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">recordatorios sin abrir</text>
  <text x="500" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">la aplicación</text>
  <rect x="670" y="250" width="290" height="90" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="815" y="278" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Invitación por correo</text>
  <text x="815" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">un panel se comparte</text>
  <text x="815" y="322" fill="#94a3b8" font-size="11" text-anchor="middle">con la otra persona</text>
  <rect x="40" y="366" width="920" height="56" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="392" fill="#e2e8f0" font-size="12" font-weight="700">Ni las fotos ni los importes salen del servidor</text>
  <text x="60" y="412" fill="#94a3b8" font-size="11">El reconocimiento de texto corre en un contenedor propio, no en un servicio de terceros. Un ticket de la compra dice dónde estuviste, a qué hora y qué compras: no es un dato que convenga ceder.</text>
</svg>
