<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui,Segoe UI,sans-serif">
  <defs><marker id="p1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
  <marker id="p2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58c896"/></marker></defs>
  <rect width="1000" height="470" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">Padel Coaching Sergio · el bono y la clase son la misma operación</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: saber quién tiene saldo y quién debe, sin restar a mano</text>
  <rect x="40" y="110" width="200" height="86" rx="12" fill="#111827" stroke="#334155"/>
  <text x="140" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Visitante</text>
  <text x="140" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">llega por una página</text>
  <text x="140" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">de su zona</text>
  <rect x="300" y="110" width="200" height="86" rx="12" fill="#0b2c3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="140" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">Solicitud</text>
  <text x="400" y="162" fill="#cbd5e1" font-size="11" text-anchor="middle">se guarda y avisa</text>
  <text x="400" y="180" fill="#cbd5e1" font-size="11" text-anchor="middle">por correo al entrenador</text>
  <rect x="560" y="110" width="180" height="86" rx="12" fill="#111827" stroke="#334155"/>
  <text x="650" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Alumno</text>
  <text x="650" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">alta en el panel</text>
  <rect x="800" y="110" width="160" height="86" rx="12" fill="#111827" stroke="#334155"/>
  <text x="880" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Bono</text>
  <text x="880" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">N clases pagadas</text>
  <path d="M242 153 H298" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#p1)"/>
  <path d="M502 153 H558" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#p1)"/>
  <path d="M742 153 H798" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#p1)"/>
  <rect x="260" y="250" width="240" height="100" rx="12" fill="#0d2018" stroke="#1f8a4e" stroke-width="2"/>
  <text x="380" y="280" fill="#58c896" font-size="14" text-anchor="middle" font-weight="700">Se da la clase</text>
  <text x="380" y="304" fill="#cbd5e1" font-size="11" text-anchor="middle">se marca la asistencia</text>
  <text x="380" y="326" fill="#94a3b8" font-size="10" text-anchor="middle">un solo gesto del entrenador</text>
  <rect x="560" y="250" width="200" height="100" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="660" y="280" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Saldo -1</text>
  <text x="660" y="304" fill="#94a3b8" font-size="11" text-anchor="middle">se descuenta solo</text>
  <text x="660" y="326" fill="#64748b" font-size="10" text-anchor="middle">nadie lleva la cuenta aparte</text>
  <rect x="800" y="250" width="160" height="100" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="880" y="280" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">¿Sin saldo?</text>
  <text x="880" y="304" fill="#fcd34d" font-size="11" text-anchor="middle">aparece la deuda</text>
  <text x="880" y="326" fill="#a16207" font-size="10" text-anchor="middle">en su ficha</text>
  <path d="M880 198 V248" stroke="#38bdf8" stroke-width="2" marker-end="url(#p1)"/>
  <path d="M502 300 H558" stroke="#58c896" stroke-width="2.5" marker-end="url(#p2)"/>
  <path d="M762 300 H798" stroke="#58c896" stroke-width="2.5" marker-end="url(#p2)"/>
  <rect x="40" y="386" width="920" height="56" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="410" fill="#e2e8f0" font-size="12" font-weight="700">Todo el negocio cabe en un fichero</text>
  <text x="60" y="430" fill="#94a3b8" font-size="11">Alumnos, bonos, clases, ingresos y gastos viven en una única base de datos embebida. Sin servidor de base de datos que administrar, y la copia de seguridad es un fichero que se abre y se comprueba.</text>
</svg>
