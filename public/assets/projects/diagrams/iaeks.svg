<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="system-ui,Segoe UI,sans-serif">
  <defs><marker id="i1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
  <rect width="1000" height="450" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">IA con Edu · el trabajo hecho acaba en la factura</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: que las horas dedicadas a un cliente no dependan de la memoria de nadie</text>
  <rect x="40" y="112" width="200" height="90" rx="12" fill="#0b2c3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="142" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">Web pública</text>
  <text x="140" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">servicios y contacto</text>
  <text x="140" y="186" fill="#64748b" font-size="10" text-anchor="middle">registra cada visita</text>
  <rect x="300" y="112" width="200" height="90" rx="12" fill="#111827" stroke="#334155"/>
  <text x="400" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Cliente</text>
  <text x="400" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">ficha, contacto</text>
  <text x="400" y="186" fill="#94a3b8" font-size="11" text-anchor="middle">y color propio</text>
  <rect x="560" y="112" width="200" height="90" rx="12" fill="#111827" stroke="#334155"/>
  <text x="660" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Proyecto</text>
  <text x="660" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">estado, repositorio</text>
  <text x="660" y="186" fill="#94a3b8" font-size="11" text-anchor="middle">y tarifa</text>
  <rect x="820" y="112" width="140" height="90" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="890" y="142" fill="#58c896" font-size="13" text-anchor="middle" font-weight="700">Factura</text>
  <text x="890" y="168" fill="#cbd5e1" font-size="11" text-anchor="middle">sale del tiempo</text>
  <text x="890" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">registrado</text>
  <path d="M242 157 H298" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#i1)"/>
  <path d="M502 157 H558" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#i1)"/>
  <path d="M762 157 H818" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#i1)"/>
  <rect x="300" y="250" width="460" height="96" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="530" y="278" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="700">Tiempo dedicado</text>
  <text x="530" y="302" fill="#fcd34d" font-size="11" text-anchor="middle">fecha, franja horaria, descripción de lo hecho</text>
  <text x="530" y="324" fill="#a16207" font-size="10" text-anchor="middle">y marca de "de regalo" cuando no se cobra</text>
  <path d="M660 204 V248" stroke="#f59e0b" stroke-width="2" marker-end="url(#i1)"/>
  <path d="M762 298 C 850 298, 890 250, 890 204" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#i1)"/>
  <rect x="40" y="250" width="230" height="96" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="155" y="278" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Captura automática</text>
  <text x="155" y="302" fill="#94a3b8" font-size="11" text-anchor="middle">navegador sin interfaz</text>
  <text x="155" y="324" fill="#64748b" font-size="10" text-anchor="middle">fotografía cada web gestionada</text>
  <rect x="40" y="372" width="920" height="52" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="398" fill="#94a3b8" font-size="11">La captura no es decoración: si el sitio de un cliente deja de responder, la imagen no se genera. Un fallo de portada se ve en la ficha antes de que llame nadie.</text>
</svg>
