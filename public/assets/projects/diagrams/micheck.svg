<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="system-ui,Segoe UI,sans-serif">
  <defs><marker id="m1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
  <marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#58c896"/></marker></defs>
  <rect width="1000" height="460" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="23" font-weight="700">MiCheck · marcar un hábito no puede depender de la cobertura</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Objetivo: que registrar cueste menos esfuerzo que saltárselo</text>
  <rect x="40" y="112" width="230" height="120" rx="12" fill="#0b2c3d" stroke="#38bdf8" stroke-width="2"/>
  <text x="155" y="142" fill="#7dd3fc" font-size="14" text-anchor="middle" font-weight="700">📱 En el móvil</text>
  <text x="155" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">app instalada, sin tienda</text>
  <text x="155" y="188" fill="#cbd5e1" font-size="11" text-anchor="middle">se marca de un toque</text>
  <text x="155" y="212" fill="#64748b" font-size="10" text-anchor="middle">funciona en avión y sin datos</text>
  <rect x="330" y="112" width="230" height="120" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="445" y="142" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="700">Guardado local</text>
  <text x="445" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">la marca se registra ya,</text>
  <text x="445" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">haya red o no</text>
  <text x="445" y="212" fill="#64748b" font-size="10" text-anchor="middle">la racha no se rompe por un túnel</text>
  <rect x="620" y="112" width="150" height="120" rx="12" fill="#0d2018" stroke="#1f8a4e"/>
  <text x="695" y="150" fill="#58c896" font-size="12" text-anchor="middle" font-weight="700">Vuelve la red</text>
  <text x="695" y="176" fill="#cbd5e1" font-size="11" text-anchor="middle">sincroniza</text>
  <text x="695" y="198" fill="#cbd5e1" font-size="11" text-anchor="middle">en segundo plano</text>
  <rect x="820" y="112" width="140" height="120" rx="12" fill="#111827" stroke="#334155"/>
  <text x="890" y="150" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="700">Servidor</text>
  <text x="890" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">niveles, logros</text>
  <text x="890" y="198" fill="#94a3b8" font-size="11" text-anchor="middle">y suscripción</text>
  <path d="M272 172 H328" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#m1)"/>
  <path d="M562 172 H618" stroke="#58c896" stroke-width="2.5" marker-end="url(#m2)"/>
  <path d="M772 172 H818" stroke="#58c896" stroke-width="2.5" marker-end="url(#m2)"/>
  <rect x="40" y="272" width="290" height="96" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="185" y="300" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">Experiencia y niveles</text>
  <text x="185" y="324" fill="#fcd34d" font-size="11" text-anchor="middle">cada marca suma puntos</text>
  <text x="185" y="346" fill="#a16207" font-size="10" text-anchor="middle">99 niveles</text>
  <rect x="355" y="272" width="290" height="96" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="500" y="300" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">Rachas</text>
  <text x="500" y="324" fill="#fcd34d" font-size="11" text-anchor="middle">días seguidos sin fallar</text>
  <text x="500" y="346" fill="#a16207" font-size="10" text-anchor="middle">lo que de verdad engancha</text>
  <rect x="670" y="272" width="290" height="96" rx="12" fill="#2a1a06" stroke="#f59e0b"/>
  <text x="815" y="300" fill="#fbbf24" font-size="12" text-anchor="middle" font-weight="700">Logros</text>
  <text x="815" y="324" fill="#fcd34d" font-size="11" text-anchor="middle">20 hitos desbloqueables</text>
  <text x="815" y="346" fill="#a16207" font-size="10" text-anchor="middle">recompensa a largo plazo</text>
  <rect x="40" y="392" width="920" height="46" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="420" fill="#94a3b8" font-size="11">Si la app necesitara red para registrar un toque, se perdería el registro y con él la racha, que es justo lo que sostiene el hábito. Por eso el guardado local no es una optimización: es el producto.</text>
</svg>
